name: Sync Fork with Upstream

on:
  schedule:
    # Weekly on Monday at 9am ET (14:00 UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/cypress-io/cypress-realworld-app.git

      - name: Fetch upstream
        run: git fetch upstream develop

      - name: Check for changes
        id: check
        run: |
          DIFF=$(git rev-list HEAD..upstream/develop --count)
          echo "commits_behind=$DIFF" >> $GITHUB_OUTPUT

      - name: Merge upstream into develop
        if: steps.check.outputs.commits_behind != '0'
        run: |
          git merge upstream/develop --no-edit
          git push origin develop

  sync-demo-branches:
    needs: sync-main
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - feature/dark-mode-toggle
          - fix/transaction-validation-messages
          - feature/accessibility-audit
          - fix/flaky-notification-badge
          - feature/transaction-notes-ui
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for merge conflict
        id: conflict-check
        run: |
          git fetch origin develop
          MERGE_BASE=$(git merge-base HEAD origin/develop)
          CONFLICT=$(git merge-tree $MERGE_BASE origin/main HEAD | grep '<<<<<<<' || true)
          if [ -n "$CONFLICT" ]; then
            echo "has_conflict=true" >> $GITHUB_OUTPUT
          else
            echo "has_conflict=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge develop into demo branch
        if: steps.conflict-check.outputs.has_conflict == 'false'
        run: |
          git merge origin/develop --no-edit
          git push origin ${{ matrix.branch }}

      - name: Create PR on conflict
        if: steps.conflict-check.outputs.has_conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ matrix.branch }}';
            const shortSha = '${{ github.sha }}'.substring(0, 7);
            const resolveBranch = `sync/${branch.replace('/', '-')}-${shortSha}`;

            await exec.exec('git', ['checkout', '-b', resolveBranch, 'origin/develop']);
            await exec.exec('git', ['push', 'origin', resolveBranch]);

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: branch,
              head: resolveBranch,
              title: `chore: sync develop into ${branch}`,
              body: `Automatic merge of develop into \`${branch}\` failed due to conflicts.\n\nPlease resolve manually. **Do not squash merge.**`,
            });